[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-budget"
version = "0.1.0"
description = "Model-agnostic token accounting and eviction strategies for multi-turn LLM conversations (Python port, work in progress)."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.setuptools]
packages = ["token_budget"]
