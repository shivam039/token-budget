name: Deploy token-budget-mcp to Render

# token-budget-mcp holds live in-memory MCP sessions per connection, so it
# does NOT use Render's own auto-deploy: that has no path filter and would
# restart the process (dropping any live sessions) on every push to main,
# including changes to unrelated packages elsewhere in this monorepo. This
# workflow instead hits the service's Render Deploy Hook only when paths
# that actually affect it change, via a repo secret named
# RENDER_MCP_DEPLOY_HOOK_URL — generated at the service's Render dashboard
# (Settings -> Deploy Hook) and added as a repository secret (Settings ->
# Secrets and variables -> Actions). See packages/token-budget-mcp/README.md
# for the full one-time setup.
#
# The deployment secret is required: a deployment workflow must fail closed
# rather than reporting success when no deployment was attempted.

on:
  push:
    branches: [main]
    paths:
      - 'packages/token-budget/src/**'
      - 'packages/token-budget-mcp/**'
      - '.github/workflows/deploy-token-budget-mcp.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require Render deploy hook
        run: |
          test -n "${{ secrets.RENDER_MCP_DEPLOY_HOOK_URL }}" || { echo "RENDER_MCP_DEPLOY_HOOK_URL is required; configure it in GitHub Actions secrets."; exit 1; }

      - name: Trigger Render deploy
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_MCP_DEPLOY_HOOK_URL }}")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Render deploy hook returned HTTP $status"
            exit 1
          fi
          echo "Triggered a new Render deploy for token-budget-mcp (hook returned HTTP $status)."

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Smoke test hosted MCP
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
        run: npm run smoke:mcp
