name: Publish Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate build and pack without publishing)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm run test

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm OIDC trusted publishing & provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Publish packages to npm (Dry Run)
        if: ${{ inputs.dry_run }}
        run: |
          PACKAGES=(
            "packages/token-budget"
            "packages/token-budget-openai"
            "packages/token-budget-anthropic"
            "packages/token-budget-claude"
            "packages/token-budget-vercel-ai"
            "packages/token-budget-langchain"
            "packages/token-budget-tiktoken"
            "packages/token-budget-embeddings"
            "packages/token-budget-otel"
            "packages/token-budget-pricing"
          )
          for pkg in "${PACKAGES[@]}"; do
            echo "::group::Dry-run for $pkg"
            npm publish -w "$pkg" --access public --dry-run
            echo "::endgroup::"
          done

      - name: Publish packages to npm
        if: ${{ !inputs.dry_run }}
        run: |
          PACKAGES=(
            "packages/token-budget"
            "packages/token-budget-openai"
            "packages/token-budget-anthropic"
            "packages/token-budget-claude"
            "packages/token-budget-vercel-ai"
            "packages/token-budget-langchain"
            "packages/token-budget-tiktoken"
            "packages/token-budget-embeddings"
            "packages/token-budget-otel"
            "packages/token-budget-pricing"
          )
          for pkg in "${PACKAGES[@]}"; do
            echo "::group::Publishing $pkg"
            npm publish -w "$pkg" --provenance --access public
            echo "::endgroup::"
          done
