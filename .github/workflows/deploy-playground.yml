name: Deploy Playground to Hugging Face Space

# Builds packages/token-budget-playground and pushes the built dist/
# output (plus the Space's README.md front matter) to the Hugging Face
# Space's own git repository. Requires a repo secret named HF_TOKEN — a
# Hugging Face access token with write access to the target Space,
# generated at https://huggingface.co/settings/tokens (Write role, or a
# fine-grained token with write access to this specific Space). See
# docs/playground.md for the full one-time setup.
#
# Safe to merge before that secret exists: the deploy step checks for it
# explicitly and prints setup instructions instead of failing red.

on:
  push:
    branches: [main]
    paths:
      - 'packages/token-budget/src/**'
      - 'packages/token-budget-playground/**'
      - 'scripts/lib/generateConversation.ts'
      - '.github/workflows/deploy-playground.yml'
  workflow_dispatch:

env:
  HF_SPACE: shivam039-dev/llm-context-budget-playground

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build core package (the playground imports it)
        run: npm run build --workspace=@shivam.dixit/token-budget

      - name: Build playground
        run: npm run build --workspace=token-budget-playground

      - name: Check for HF_TOKEN
        id: check_token
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HF_TOKEN repo secret is not set — skipping deploy. See docs/playground.md for setup: generate a write-access token at https://huggingface.co/settings/tokens, then add it as a repository secret named HF_TOKEN (Settings -> Secrets and variables -> Actions)."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Hugging Face Space
        if: steps.check_token.outputs.has_token == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          cp packages/token-budget-playground/README.md packages/token-budget-playground/dist/README.md
          cd packages/token-budget-playground/dist
          git init -q
          git checkout -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy playground build from ${{ github.repository }}@${GITHUB_SHA::7}"
          git push --force "https://shivam039-dev:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main:main
          echo "Deployed to https://huggingface.co/spaces/${HF_SPACE}"
