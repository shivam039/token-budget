name: Verify token-budget-mcp
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Check health and readiness
        env: { MCP_BASE_URL: "${{ secrets.MCP_BASE_URL }}" }
        run: |
          curl --fail --silent "$MCP_BASE_URL/healthz"; echo
          curl --fail --silent "$MCP_BASE_URL/readyz"; echo
      - name: Run MCP smoke test
        env:
          {
            MCP_BASE_URL: "${{ secrets.MCP_BASE_URL }}",
            MCP_API_KEY: "${{ secrets.MCP_API_KEY }}",
          }
        run: npm run smoke:mcp
